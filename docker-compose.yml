services:
  postgres:
    image: postgres:16-alpine
    container_name: inkloom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: inkloom
      POSTGRES_USER: inkloom
      POSTGRES_PASSWORD: inkloom
    ports:
      - "5432:5432"
    volumes:
      - inkloom-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inkloom -d inkloom"]
      interval: 5s
      timeout: 5s
      retries: 12

  chroma:
    image: chromadb/chroma:0.6.3
    container_name: inkloom-chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - inkloom-chroma-data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8000/api/v2/heartbeat || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  inkloom-postgres-data:
  inkloom-chroma-data:
